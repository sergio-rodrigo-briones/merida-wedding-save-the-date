<div class="controls">
  @if (stage() === 'opening' || stage() === 'stitching') {
    <button type="button" class="text-button" (click)="skip()">{{ t().a11y.skipAnimation }}</button>
  } @else if (stage() === 'done') {
    <button type="button" class="text-button" (click)="replay()">{{ t().a11y.replay }}</button>
  }
</div>

<!-- Envelope and card share one grid cell, so one can fade in over the other. -->
<main>
  @if (introShown()) {
    <section #intro class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title" class="eyebrow">
        {{ t().saveTheDate.headline }}<span class="visually-hidden"> · {{ names }}</span>
      </h1>
      <app-envelope [names]="names" [place]="city()" [label]="envelopeLabel()" (opened)="open()" />
      <p class="hint">{{ t().envelope.hint }}</p>
    </section>
  }
  @if (stage() !== 'closed') {
    <div class="opened" [class.shown]="cardShown()" [attr.aria-hidden]="cardShown() ? null : true">
      <app-invitation-card
        [names]="names"
        [date]="wedding.date"
        [timeZone]="wedding.timeZone"
        [city]="city()"
      />
      <!-- Scrolling stays the guest's choice: the cue only offers it. -->
      <button
        type="button"
        class="cue"
        [class.ready]="stage() === 'done'"
        aria-controls="story"
        (click)="toStory()"
      >
        {{ t().story.cue }}
        <svg viewBox="0 0 14 40" aria-hidden="true">
          <line class="cue-thread" x1="7" y1="0" x2="7" y2="30" />
          <path class="cue-arrow" d="M2 30 L7 37 L12 30" />
        </svg>
      </button>
      <app-story [story]="wedding.story" />
    </div>
  }
</main>
