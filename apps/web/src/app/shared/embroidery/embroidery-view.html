<svg [attr.viewBox]="viewBox()" focusable="false">
  @if (guide()) {
    <g class="guide">
      @for (cell of cells(); track $index) {
        <rect [attr.x]="cell.x" [attr.y]="cell.y" width="6" height="6" [style.fill]="cell.color" />
      }
    </g>
  }
  <g class="stitches">
    @for (cross of crosses(); track $index) {
      @for (leg of cross.legs; track $index) {
        <line
          class="body"
          pathLength="1"
          [attr.x1]="leg.x1"
          [attr.y1]="leg.y1"
          [attr.x2]="leg.x2"
          [attr.y2]="leg.y2"
          [style.stroke]="cross.color"
        />
        <line
          class="sheen"
          pathLength="1"
          [attr.x1]="leg.x1"
          [attr.y1]="leg.y1"
          [attr.x2]="leg.x2"
          [attr.y2]="leg.y2"
        />
      }
    }
  </g>
</svg>
